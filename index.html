<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16181d">
<title>Fotolab — Editor Foto dengan Heal</title>
<style>
:root{--bg:#111317;--panel:#181b21;--panel2:#22262e;--panel3:#2a2f38;--line:#2a2f38;--text:#e9ebef;--muted:#8b929e;--accent:#3d9bff;--accent2:#2a83ea;--heal:#ff4d79}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--text)}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:2px;padding:0 8px;padding-top:env(safe-area-inset-top);min-height:52px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin-right:auto;padding-left:4px;white-space:nowrap}
.logo{width:26px;height:26px;border-radius:7px;background:conic-gradient(from 200deg,#3d9bff,#7b61ff,#ff4d79,#ffb84d,#3d9bff);position:relative}
.logo:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel)}
.tb{height:36px;min-width:36px;padding:0 9px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--text);white-space:nowrap}
.tb:hover{background:var(--panel2)}
.tb:disabled{opacity:.3;pointer-events:none}
.tb svg{width:20px;height:20px}
.tb.primary{background:var(--accent);color:#fff;font-weight:600;margin-left:6px}
.tb.primary:hover{background:var(--accent2)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.zoomlbl{min-width:50px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
#main{flex:1;display:grid;grid-template-columns:76px 1fr 300px;min-height:0}
#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 6px;gap:3px;overflow:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 7px;border-radius:10px;color:var(--muted);font-size:11px;flex:none}
.tool svg{width:22px;height:22px}
.tool:hover{color:var(--text);background:var(--panel2)}
.tool.active{background:rgba(61,155,255,.15);color:var(--accent)}
.tool[data-t=heal].active{background:rgba(255,77,121,.15);color:var(--heal)}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#0b0d10}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch}
.ph{font-weight:700;font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ph .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}
.sl{margin:9px 0}
.slh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.slh span{color:#c9cdd4}
.slh output{color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p),var(--panel3) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--panel3)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0}
.hint{font-size:12.5px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:10px 12px;margin:10px 0;line-height:1.5}
.hint b{color:var(--text)}
.btn{height:38px;padding:0 14px;border-radius:9px;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;flex:1;white-space:nowrap}
.btn:hover{background:var(--panel3)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.on{background:rgba(61,155,255,.18);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px;margin:10px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.seg button{padding:7px 11px;border-radius:8px;background:var(--panel2);font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
input[type=color]{width:32px;height:32px;border:0;border-radius:50%;background:none;padding:0;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:2px solid rgba(255,255,255,.25);border-radius:50%}
textarea,select,.fld input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;outline:none;-webkit-user-select:text;user-select:text}
textarea{resize:vertical;min-height:62px}
textarea:focus,select:focus,.fld input[type=text]:focus{border-color:var(--accent)}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.fl{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#c9cdd4}
.fl canvas{width:100%;aspect-ratio:1;border-radius:9px;display:block;background:var(--panel2)}
.fl.on canvas{box-shadow:0 0 0 2px var(--accent)}
.fl.on{color:var(--accent)}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.drop{max-width:440px;width:100%;text-align:center;border:1.5px dashed #343a45;border-radius:18px;padding:34px 24px;background:rgba(24,27,33,.6)}
.drop.over{border-color:var(--accent);background:rgba(61,155,255,.07)}
.drop h1{font-size:21px;margin:14px 0 6px}
.drop p{color:var(--muted);font-size:13.5px;margin-bottom:20px}
.drop .big{width:64px;height:64px;margin:0 auto;border-radius:18px;background:linear-gradient(135deg,#3d9bff,#7b61ff);display:flex;align-items:center;justify-content:center}
.drop .big svg{width:32px;height:32px;color:#fff}
.drop .row{justify-content:center}
.drop .btn{flex:none}
#busy{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(20,22,27,.92);border:1px solid var(--line);padding:9px 16px;border-radius:20px;font-size:13px;display:none;align-items:center;gap:9px;pointer-events:none}
#busy.show{display:flex}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--panel3);border-top-color:var(--heal);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,10px);background:rgba(20,22,27,.95);border:1px solid var(--line);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#cmpBadge{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:6px;font-size:12px;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:400px}
.sheet h3{font-size:17px;margin-bottom:12px}
.fld{display:block;margin:12px 0;font-size:13px;color:#c9cdd4}
.fld input[type=text]{margin-top:6px}
.muted{color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
@media (max-width:860px){
  #main{display:flex;flex-direction:column}
  #stage{flex:1}
  #panel{order:2;border-left:0;border-top:1px solid var(--line);max-height:36vh;padding:10px 14px 12px;flex:none}
  #panel.collapsed{display:none}
  #tools{order:3;flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;padding:5px 6px calc(5px + env(safe-area-inset-bottom));flex:none;gap:2px}
  .tool{min-width:60px}
  .tb .lbl,.hide-m{display:none}
  .ph{margin-bottom:6px}
  .filters{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
}
@media (max-width:420px){.brand b{display:none}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><div class="logo"></div><b>Fotolab</b></div>
    <button class="tb" id="bOpen" title="Buka foto (Ctrl+O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">Buka</span></button>
    <div class="sep hide-m"></div>
    <button class="tb" id="bUndo" title="Urungkan (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="tb" id="bRedo" title="Ulangi (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="tb" id="bCmp" title="Tahan untuk melihat foto asli (\)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" /><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg><span class="lbl">Bandingkan</span></button>
    <div class="sep hide-m"></div>
    <button class="tb hide-m" id="bZoomOut" title="Perkecil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
    <button class="tb zoomlbl" id="bFit" title="Pas layar (Ctrl+0)">100%</button>
    <button class="tb hide-m" id="bZoomIn" title="Perbesar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
    <button class="tb primary" id="bExport" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">Ekspor</span></button>
  </header>
  <div id="main">
    <nav id="tools"></nav>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="empty">
        <div class="drop" id="drop">
          <div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></div>
          <h1>Edit foto langsung di browser</h1>
          <p>Hapus noda, jerawat dan objek kecil dengan <b style="color:var(--heal)">Heal</b>, lalu atur warna, filter, potong, dan tambah teks. Foto tidak diunggah ke mana pun.</p>
          <div class="row"><button class="btn primary" id="eOpen">Buka Foto</button><button class="btn" id="eSample">Coba Foto Contoh</button></div>
          <p class="muted" style="margin:10px 0 0">atau seret &amp; lepas / tempel (Ctrl+V) gambar di sini</p>
        </div>
      </div>
      <div id="cmpBadge">Foto asli</div>
      <div id="busy"><div class="spin"></div><span>Menyembuhkan…</span></div>
      <div id="toast"></div>
    </div>
    <aside id="panel"></aside>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>

<div class="modal" id="exModal">
  <div class="sheet">
    <h3>Ekspor Foto</h3>
    <label class="fld">Nama file<input type="text" id="exName" value="foto-edit"></label>
    <div class="fld">Format<div class="seg" id="exFmt"><button data-v="image/jpeg" class="on">JPG</button><button data-v="image/png">PNG</button></div></div>
    <div class="fld" id="exQWrap"><div class="slh"><span>Kualitas</span><output id="exQv">92</output></div><input type="range" id="exQ" min="40" max="100" value="92"></div>
    <div class="fld">Ukuran<div class="seg" id="exScale"><button data-v="1" class="on">100%</button><button data-v="0.75">75%</button><button data-v="0.5">50%</button><button data-v="0.25">25%</button></div><div class="muted" id="exDim"></div></div>
    <div class="actions"><button class="btn" id="exCancel">Batal</button><button class="btn" id="exShare">Bagikan / Simpan</button><button class="btn primary" id="exGo">Unduh</button></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const view=$('#view'), vctx=view.getContext('2d');
const DPR=()=>Math.min(window.devicePixelRatio||1,2);
const isTouch=matchMedia('(pointer:coarse)').matches;
const MAX_SIDE=isTouch?3000:4096;
const BUDGET=isTouch?200e6:600e6;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

/* ---------- icons ---------- */
const IC={
 hand:'<path d="M8 11V5.5a1.5 1.5 0 0 1 3 0V10M11 9.5V4.5a1.5 1.5 0 0 1 3 0V10M14 10V6a1.5 1.5 0 0 1 3 0v6.5c0 4.5-2.7 7.5-6.5 7.5-2.5 0-4-1.2-5.3-3.2L3.3 13.6a1.5 1.5 0 0 1 2.5-1.6L8 14.5V8a1.5 1.5 0 0 1 3 0"/>',
 heal:'<rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-45 12 12)"/><rect x="9" y="9" width="6" height="6" rx="1" transform="rotate(-45 12 12)"/><path d="M11 12h.01M13 12h.01M12 11v.01M12 13v.01"/>',
 clone:'<path d="M9.5 3.5h5v5.5l3.5 3H6l3.5-3z"/><path d="M5 12h14v3.5H5zM7 19.5h10"/>',
 brush:'<path d="M19.5 3.5l1 1-8.5 9.5-2-2z"/><path d="M9.5 12.5c-2.3 0-3.8 1.5-3.8 3.5 0 1.3-.9 2.3-2.2 2.5 1 1.3 2.7 2 4.3 2 2.6 0 4.2-1.9 4.2-4.3"/>',
 crop:'<path d="M6 2.5V16a2 2 0 0 0 2 2h13.5"/><path d="M18 21.5V8a2 2 0 0 0-2-2H2.5"/>',
 adjust:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
 filter:'<circle cx="9" cy="9" r="5.5"/><circle cx="15" cy="9" r="5.5"/><circle cx="12" cy="15" r="5.5"/>',
 text:'<path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6"/>',
 rotl:'<path d="M3 4v5h5"/><path d="M3.5 9a8.5 8.5 0 1 1 2 8.3"/>',
 rotr:'<path d="M21 4v5h-5"/><path d="M20.5 9a8.5 8.5 0 1 0-2 8.3"/>',
 fliph:'<path d="M12 3v18"/><path d="M8.5 7L3.5 17h5zM15.5 7l5 10h-5z"/>',
 flipv:'<path d="M3 12h18"/><path d="M7 8.5L17 3.5v5zM7 15.5l10 5v-5z"/>',
 target:'<circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 reset:'<path d="M4 4v5h5"/><path d="M4.6 15a8 8 0 1 0 .4-6"/>'
};
const svg=(k,w=1.8)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;

const TOOLS=[
 ['hand','Geser','H'],['heal','Heal','J'],['clone','Klon','S'],['brush','Kuas','B'],
 ['crop','Potong','C'],['adjust','Atur','A'],['filter','Filter','F'],['text','Teks','T']
];

/* ---------- state ---------- */
function defParams(){return {exposure:0,brightness:0,contrast:0,highlights:0,shadows:0,fade:0,saturation:0,vibrance:0,temperature:0,tint:0,hue:0,sharpen:0,vignette:0,grain:0,grayscale:0,sepia:0};}
const FONTS=[['Sans','-apple-system, "Helvetica Neue", Arial, sans-serif'],['Serif','Georgia, "Times New Roman", serif'],['Tebal','Impact, "Arial Black", "Helvetica Neue", sans-serif'],['Tulisan tangan','"Snell Roundhand", "Brush Script MT", "Segoe Script", cursive'],['Bulat','"Avenir Next Rounded", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif'],['Mono','"SF Mono", Menlo, Consolas, monospace']];
const S={
 doc:null,dctx:null,W:0,H:0,orig:null,stroke:null,sctx:null,backup:null,bctx:null,
 v:{s:1,x:0,y:0}, tool:'heal',
 size:{heal:40,clone:40,brush:30},
 brush:{color:'#ff4d79',hardness:.7,opacity:1},
 clone:{hardness:.5,opacity:1,src:null,off:null,setting:false},
 text:{text:'Teks Anda',font:FONTS[0][1],size:80,color:'#ffffff',bold:true,italic:false,outline:0,outlineColor:'#000000',shadow:true,x:0,y:0,dirty:false},
 crop:{x:0,y:0,w:0,h:0,ratio:0,rid:'free'},
 params:defParams(), filterId:'asli', filterAmt:100,
 prev:null,pctx:null,psrc:null,previewActive:false,
 undo:[],redo:[],comparing:false,hover:null,space:false
};
const FILTERS=[
 {id:'asli',n:'Asli',p:{}},
 {id:'cerah',n:'Cerah',p:{exposure:12,brightness:8,shadows:30,vibrance:25}},
 {id:'pop',n:'Pop',p:{saturation:40,vibrance:30,contrast:18}},
 {id:'hangat',n:'Hangat',p:{temperature:40,saturation:10,highlights:-10}},
 {id:'dingin',n:'Dingin',p:{temperature:-40,tint:-5,contrast:10}},
 {id:'senja',n:'Senja',p:{temperature:55,tint:18,saturation:20,vignette:25,highlights:-15}},
 {id:'vintage',n:'Vintage',p:{fade:45,sepia:.25,contrast:-8,temperature:20,vignette:35,grain:20}},
 {id:'film',n:'Film',p:{fade:25,contrast:20,temperature:10,tint:8,grain:25,saturation:-10}},
 {id:'pudar',n:'Pudar',p:{fade:60,saturation:-25,contrast:-10}},
 {id:'daun',n:'Daun',p:{hue:10,saturation:15,temperature:-15,tint:-20}},
 {id:'dramatis',n:'Dramatis',p:{contrast:40,highlights:-40,shadows:30,saturation:-15,vignette:40,sharpen:30}},
 {id:'bw',n:'Hitam Putih',p:{grayscale:1,contrast:15}},
 {id:'noir',n:'Noir',p:{grayscale:1,contrast:55,shadows:-20,vignette:50,grain:15}},
 {id:'sepia',n:'Sepia',p:{sepia:.9,contrast:5}},
 {id:'tajam',n:'Tajam',p:{sharpen:60,contrast:10,vibrance:10}}
];

/* ---------- UI helpers ---------- */
let toastT;
function toast(m,ms=2200){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);}
function busy(on,msg){$('#busy span').textContent=msg||'Memproses…';$('#busy').classList.toggle('show',on);}
function h(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function slider(label,min,max,step,val,onInput,o={}){
 const w=h(`<div class="sl"><div class="slh"><span>${label}</span><output></output></div><input type="range" min="${min}" max="${max}" step="${step}"></div>`);
 const inp=w.querySelector('input'),out=w.querySelector('output');const fmt=o.fmt||(v=>Math.round(v));
 const upd=()=>{out.textContent=fmt(+inp.value);inp.style.setProperty('--p',((inp.value-min)/(max-min)*100)+'%');};
 inp.value=val;upd();
 inp.addEventListener('input',()=>{upd();onInput(+inp.value);});
 if(o.def!==undefined){out.title='Ketuk untuk reset';out.addEventListener('click',()=>{inp.value=o.def;upd();onInput(o.def);});}
 w.set=v=>{inp.value=v;upd();};
 return w;
}

 else{t.x=ip.x;t.y=ip.y;textDrag={dx:0,dy:0};}
 t.dirty=true;req();
}
function applyText(){
 const t=S.text;if(!t.text.trim()){toast('Teks masih kosong');return;}
 const b=drawText(document.createElement('canvas').getContext('2d'),t),pad=t.size*.6;
 const r=bbInt([b.x-pad,b.y-pad,b.x+b.w+pad,b.y+b.h+pad]);
 if(r){const before=S.dctx.getImageData(r.x,r.y,r.w,r.h);drawText(S.dctx,t);pushHist({x:r.x,y:r.y,data:before});}
 t.dirty=false;toast('Teks ditambahkan');req();
}

/* ---------- panel ---------- */
const panel=$('#panel');
function head(title,color){return h(`<div class="ph"><span class="dot" style="background:${color||'var(--accent)'}"></span>${title}</div>`);}
function sizeSlider(tool){return slider('Ukuran kuas',2,Math.max(200,Math.round(Math.min(S.W||800,S.H||800)*.4)),1,S.size[tool],v=>{S.size[tool]=v;req();},{fmt:v=>v+' px'});}
function buildPanel(){
 panel.innerHTML='';const t=S.tool,P=x=>panel.appendChild(x);
 if(!S.doc){P(head('Selamat datang'));P(h(`<div class="hint">Buka foto untuk mulai mengedit. Alat <b>Heal</b> menghapus noda, jerawat, debu, kabel dan objek kecil secara otomatis.</div>`));return;}
 if(t==='hand'){P(head('Geser & Zoom'));P(h(`<div class="hint">Seret untuk menggeser foto. <b>Cubit dua jari</b> atau gulir mouse untuk zoom.<br><br><b>Pintasan:</b> H geser · J heal · S klon · B kuas · C potong · A atur · F filter · T teks · [ ] ukuran kuas · Spasi+seret geser · Ctrl+Z urungkan · Ctrl+0 pas layar · \\ bandingkan</div>`));
  const r=h('<div class="row"></div>');r.append(button('Pas layar','',fitView),button('100%','',()=>{const c=center();zoomAt(c,DPR()/S.v.s);}));P(r);}
 if(t==='heal'){P(head('Heal — Penyembuh Noda','var(--heal)'));P(sizeSlider('heal'));
  P(h(`<div class="hint">Sapukan kuas di atas <b>noda, jerawat, debu, kabel</b> atau objek kecil. Saat jari/mouse dilepas, area merah diisi otomatis dengan tekstur dari sekitarnya.<br><br>Tips: pakai kuas sedikit lebih besar dari noda, dan untuk objek panjang sapukan sekali jalan.</div>`));}
 if(t==='clone'){P(head('Stempel Klon','#ffd34d'));P(sizeSlider('clone'));
  P(slider('Kelembutan tepi',0,100,1,Math.round((1-S.clone.hardness)*100),v=>S.clone.hardness=1-v/100,{fmt:v=>v+'%'}));
  P(slider('Opasitas',5,100,1,Math.round(S.clone.opacity*100),v=>S.clone.opacity=v/100,{fmt:v=>v+'%'}));
  const r=h('<div class="row"></div>');r.append(button(svg('target')+(S.clone.setting?'Ketuk area sumber…':'Atur Sumber'),S.clone.setting?'on':'',()=>{S.clone.setting=!S.clone.setting;buildPanel();req();}));P(r);
  P(h(`<div class="hint">Salin piksel dari satu area ke area lain. ${isTouch?'Ketuk <b>Atur Sumber</b> lalu ketuk area yang ingin disalin':'<b>Alt+klik</b> (atau tombol Atur Sumber) untuk memilih area sumber'}, lalu sapukan di tempat tujuan.</div>`));}
 if(t==='brush'){P(head('Kuas',S.brush.color));
  const sw=h('<div class="swatches"></div>');['#ffffff','#000000','#ff4d79','#ffb84d','#ffe14d','#4dd98a','#3d9bff','#9b6bff'].forEach(c=>{const b=h(`<button class="sw ${c===S.brush.color?'on':''}" style="background:${c}"></button>`);b.onclick=()=>{S.brush.color=c;buildPanel();};sw.appendChild(b);});
  const ci=h(`<input type="color" value="${S.brush.color}">`);ci.oninput=()=>{S.brush.color=ci.value;sw.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));};sw.appendChild(ci);P(sw);
  P(sizeSlider('brush'));P(slider('Kekerasan',0,100,1,Math.round(S.brush.hardness*100),v=>S.brush.hardness=v/100,{fmt:v=>v+'%'}));
  P(slider('Opasitas',5,100,1,Math.round(S.brush.opacity*100),v=>S.brush.opacity=v/100,{fmt:v=>v+'%'}));}
 if(t==='crop'){P(head('Potong & Putar'));
  const seg=h('<div class="seg"></div>');[['free','Bebas',0],['orig','Asli',S.W/S.H],['1','1:1',1],['45','4:5',4/5],['43','4:3',4/3],['34','3:4',3/4],['169','16:9',16/9],['916','9:16',9/16]].forEach(([id,n,rt])=>{const b=h(`<button class="${S.crop.rid===id?'on':''}">${n}</button>`);b.onclick=()=>{if(!rt){S.crop.ratio=0;S.crop.rid='free';}else setRatio(rt,id);buildPanel();req();};seg.appendChild(b);});P(seg);
  P(h(`<div class="muted" id="cropInfo"></div>`));
  const r=h('<div class="row"></div>');r.append(button(svg('rotl'),'',()=>transformDoc('rotl')),button(svg('rotr'),'',()=>transformDoc('rotr')),button(svg('fliph'),'',()=>transformDoc('fliph')),button(svg('flipv'),'',()=>transformDoc('flipv')));P(r);
  const r2=h('<div class="row"></div>');r2.append(button('Reset','',()=>{S.crop.ratio=0;S.crop.rid='free';resetCrop();buildPanel();req();}),button(svg('check',2.2)+'Potong','primary',applyCrop));P(r2);
  updCropInfo();}
 if(t==='adjust'){P(head('Atur Warna & Cahaya'));
  const A=(lbl,key,min=-100,max=100)=>P(slider(lbl,min,max,1,S.params[key],v=>{S.params[key]=v;updatePreview();},{def:0}));
  P(h('<div class="grp">Cahaya</div>'));A('Eksposur','exposure');A('Kecerahan','brightness');A('Kontras','contrast');A('Highlight','highlights');A('Bayangan','shadows');A('Pudar','fade',0,100);
  P(h('<div class="grp">Warna</div>'));A('Saturasi','saturation');A('Vibrance','vibrance');A('Suhu','temperature');A('Rona (tint)','tint');A('Hue','hue',-180,180);
  P(h('<div class="grp">Efek</div>'));A('Ketajaman','sharpen',0,100);A('Vignette','vignette');A('Grain','grain',0,100);
  adjButtons(P);}
 if(t==='filter'){P(head('Filter'));
  const g=h('<div class="filters"></div>');FILTERS.forEach(f=>{const b=h(`<button class="fl ${S.filterId===f.id?'on':''}"><canvas width="120" height="120" data-id="${f.id}"></canvas><span>${f.n}</span></button>`);b.onclick=()=>{g.querySelectorAll('.fl').forEach(x=>x.classList.remove('on'));b.classList.add('on');setFilter(f.id);};g.appendChild(b);});P(g);
  P(slider('Intensitas',0,100,1,S.filterAmt,v=>{S.filterAmt=v;setFilter(S.filterId);},{fmt:v=>v+'%'}));
  adjButtons(P);drawThumbs();}
 if(t==='text'){const tx=S.text;P(head('Teks'));
  const ta=h(`<textarea placeholder="Tulis teks…"></textarea>`);ta.value=tx.text;ta.oninput=()=>{tx.text=ta.value;tx.dirty=true;req();};P(ta);
  const sel=h('<select style="margin-top:8px"></select>');FONTS.forEach(([n,f])=>{const o=document.createElement('option');o.value=f;o.textContent=n;if(f===tx.font)o.selected=true;sel.appendChild(o);});sel.onchange=()=>{tx.font=sel.value;req();};P(sel);
  P(slider('Ukuran',8,Math.round(Math.max(S.W,S.H)*.4),1,tx.size,v=>{tx.size=v;req();},{fmt:v=>v+' px'}));
  const sw=h('<div class="swatches"></div>');const ci=h(`<input type="color" value="${tx.color}">`);
  ['#ffffff','#000000','#ff4d79','#ffb84d','#ffe14d','#4dd98a','#3d9bff'].forEach(c=>{const b=h(`<button class="sw ${c===tx.color?'on':''}" style="background:${c}"></button>`);b.onclick=()=>{tx.color=c;ci.value=c;sw.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on');req();};sw.appendChild(b);});
  ci.oninput=()=>{tx.color=ci.value;req();};sw.appendChild(ci);P(sw);
  const r=h('<div class="row"></div>');const tg=(lbl,key)=>{const b=button(lbl,tx[key]?'on':'',()=>{tx[key]=!tx[key];b.classList.toggle('on',tx[key]);req();});return b;};
  r.append(tg('<b>B</b>','bold'),tg('<i>I</i>','italic'),tg('Bayangan','shadow'));P(r);
  P(slider('Garis tepi',0,100,1,tx.outline,v=>{tx.outline=v;req();},{fmt:v=>v+'%'}));
  P(h('<div class="hint">Seret teks di foto untuk memindahkan, atau ketuk tempat lain untuk menaruhnya di sana.</div>'));
  const r2=h('<div class="row"></div>');r2.append(button(svg('check',2.2)+'Tambahkan ke Foto','primary',applyText));P(r2);}
}
function adjButtons(P){const r=h('<div class="row" style="margin-top:16px"></div>');
 r.append(button(svg('reset')+'Reset','',()=>{cancelAdjust();buildPanel();}),button(svg('check',2.2)+'Terapkan','primary',()=>{if(applyAdjust()){buildPreviewSrc();buildPanel();}}));P(r);}

function setTool(t,force){
 if(t===S.tool&&!force){if(isTouch)panel.classList.toggle('collapsed');return;}
 panel.classList.remove('collapsed');
 const prev=S.tool;
 if(prev!==t&&S.doc){
  if((prev==='adjust'||prev==='filter')&&!(t==='adjust'||t==='filter')){if(applyAdjust(true))toast('Penyesuaian diterapkan');}
  if(prev==='text'&&S.text.dirty&&S.text.text.trim())applyText();
  if(prev==='clone')S.clone.setting=false;
 }
 S.tool=t;
 document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
 if(S.doc&&(t==='adjust'||t==='filter')){buildPreviewSrc();if(!isDef(S.params))updatePreview();}
 if(t==='text'&&S.doc&&!S.text.dirty){S.text.x=S.W/2;S.text.y=S.H/2;}
 view.style.cursor=t==='hand'?'grab':(t==='text'?'move':(t==='crop'||t==='adjust'||t==='filter'?'default':'crosshair'));
 if(['heal','clone','brush'].includes(t)&&!isTouch)view.style.cursor='none';
 buildPanel();req();
}

/* ---------- compare ---------- */
const cmp=$('#bCmp');
const cmpOn=e=>{if(!S.doc)return;e.preventDefault();S.comparing=true;$('#cmpBadge').style.display='block';req();};
const cmpOff=()=>{if(!S.comparing)return;S.comparing=false;$('#cmpBadge').style.display='none';req();};
cmp.addEventListener('pointerdown',cmpOn);['pointerup','pointerleave','pointercancel'].forEach(ev=>cmp.addEventListener(ev,cmpOff));

/* ---------- keyboard ---------- */
window.addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&e.key!=='Escape')return;
 const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
 if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
 if(mod&&k==='y'){e.preventDefault();redo();return;}
 if(mod&&k==='o'){e.preventDefault();$('#file').click();return;}
 if(mod&&k==='s'){e.preventDefault();if(S.doc)openExport();return;}
 if(mod&&k==='0'){e.preventDefault();fitView();return;}
 if(mod&&(k==='='||k==='+')){e.preventDefault();zoomAt(center(),1.25);return;}
 if(mod&&k==='-'){e.preventDefault();zoomAt(center(),.8);return;}
 if(mod)return;
 if(e.code==='Space'){S.space=true;view.style.cursor='grab';e.preventDefault();return;}
 if(e.key==='\\'){cmpOn(e);return;}
 if(e.key==='['||e.key===']'){const t=S.tool;if(S.size[t]){S.size[t]=clamp(Math.round(S.size[t]*(e.key===']'?1.15:1/1.15)),2,2000);buildPanel();req();}return;}
 if(e.key==='Enter'){if(S.tool==='crop')applyCrop();else if(S.tool==='adjust'||S.tool==='filter'){if(applyAdjust()){buildPreviewSrc();buildPanel();}}return;}
 const map={h:'hand',j:'heal',s:'clone',b:'brush',c:'crop',a:'adjust',f:'filter',t:'text'};
 if(map[k]&&S.doc)setTool(map[k]);
});
window.addEventListener('keyup',e=>{if(e.code==='Space'){S.space=false;setTool(S.tool,true);}if(e.key==='\\')cmpOff();});

/* ---------- export ---------- */
const ex={fmt:'image/jpeg',scale:1};
function openExport(){
 if(S.tool==='adjust'||S.tool==='filter'){if(applyAdjust(true)){buildPreviewSrc();buildPanel();}}
 if(S.tool==='text'&&S.text.dirty&&S.text.text.trim()){applyText();}
 updEx();$('#exModal').classList.add('show');
 $('#exShare').style.display=(!inFrame&&navigator.canShare&&navigator.canShare({files:[new File([new Blob()],'a.jpg',{type:'image/jpeg'})]}))?'':'none';
}
function updEx(){const w=Math.round(S.W*ex.scale),hh=Math.round(S.H*ex.scale);$('#exDim').textContent=`${w} × ${hh} px`;$('#exQWrap').style.display=ex.fmt==='image/jpeg'?'':'none';}
function segBind(sel,key,parse){const s=$(sel);s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));ex[key]=parse(b.dataset.v);updEx();});}
segBind('#exFmt','fmt',v=>v);segBind('#exScale','scale',v=>+v);
const exQ=$('#exQ');const updQ=()=>{$('#exQv').textContent=exQ.value;exQ.style.setProperty('--p',((exQ.value-40)/60*100)+'%');};exQ.oninput=updQ;updQ();
$('#bExport').onclick=openExport;
$('#exCancel').onclick=()=>$('#exModal').classList.remove('show');
$('#exModal').addEventListener('click',e=>{if(e.target.id==='exModal')$('#exModal').classList.remove('show');});
function makeBlob(){return new Promise((res,rej)=>{
 let c=S.doc;if(ex.scale!==1){c=mk(Math.max(1,Math.round(S.W*ex.scale)),Math.max(1,Math.round(S.H*ex.scale)));const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(S.doc,0,0,c.width,c.height);}
 if(ex.fmt==='image/jpeg'){const t=mk(c.width,c.height),x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,t.width,t.height);x.drawImage(c,0,0);c=t;}
 c.toBlob(b=>b?res(b):rej(new Error('Gagal membuat file')),ex.fmt,+exQ.value/100);
});}
const fname=()=>(($('#exName').value||'foto-edit').replace(/[\\/:*?"<>|]+/g,'-'))+(ex.fmt==='image/png'?'.png':'.jpg');
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d;}).catch(()=>{});}catch(e){}
const inFrame=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
$('#exGo').onclick=async()=>{busy(true,'Menyiapkan file…');try{const b=await makeBlob();
 if(DL){busy(false);try{await DL.save({filename:fname(),data:b});$('#exModal').classList.remove('show');toast('Foto disimpan');}catch(err){if(err&&err.code!=='declined')toast('Tidak bisa menyimpan: '+(err.message||err.code));}return;}
 const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fname();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);$('#exModal').classList.remove('show');toast('Foto diunduh');}catch(e){toast(e.message);}busy(false);};
$('#exShare').onclick=async()=>{try{const b=await makeBlob();const f=new File([b],fname(),{type:ex.fmt});await navigator.share({files:[f]});$('#exModal').classList.remove('show');}catch(e){if(e.name!=='AbortError')toast('Tidak bisa membagikan: '+e.message);}};

/* ---------- init ---------- */
setTool('heal',true);resizeView();
window.addEventListener('beforeunload',e=>{if(S.undo.length){e.preventDefault();e.returnValue='';}});
window.__fotolab=S; // for debugging
})();
</script>
</body>
